<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI + PostgreSQL backend template</title>
  <desc id="desc">A FastAPI, PostgreSQL and Alembic starter with pgvector, Docker Compose and health checks. A terminal shows docker compose starting the db, api and adminer containers and the readiness check returning ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0f1d36"/>
      <stop offset="1" stop-color="#0b3a3f"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4169e1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4169e1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .line { animation: fadein 0.5s ease-out backwards; }
      .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 0.7s; } .l3 { animation-delay: 1.0s; }
      .l4 { animation-delay: 1.3s; } .l5 { animation-delay: 1.8s; } .l6 { animation-delay: 2.3s; }
      .l7 { animation-delay: 2.6s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes fadein { from { opacity: 0; transform: translateX(-6px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="180" cy="40" r="260" fill="url(#glowBlue)"/>
    <circle cx="1080" cy="300" r="300" fill="url(#glowTeal)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left: title block -->
  <g class="sans">
    <rect x="64" y="70" width="190" height="30" rx="15" fill="#14b8a6" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="159" y="90" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="2.5">BACKEND TEMPLATE</text>
    <text x="62" y="160" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-1">FastAPI <tspan fill="#2dd4bf">+</tspan> PostgreSQL</text>
    <text x="64" y="202" fill="#cbd5e1" font-size="20">Alembic migrations · pgvector · Docker Compose · health checks</text>
    <text x="64" y="244" fill="#94a3b8" font-size="17">Clone it, run one command, start building your API.</text>
  </g>

  <!-- Right: terminal card -->
  <g transform="translate(748 44)">
    <rect width="468" height="232" rx="14" fill="#060b16" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M0 14a14 14 0 0 1 14-14h440a14 14 0 0 1 14 14v22H0z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="234" y="23" text-anchor="middle" class="mono" font-size="12" fill="#64748b">~/xts</text>

    <g class="mono">
      <text class="line l1" x="22" y="66"><tspan fill="#2dd4bf">$</tspan><tspan fill="#e2e8f0"> docker compose up -d --build</tspan></text>

      <g class="line l2">
        <path d="M24 87l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="92" fill="#94a3b8">Container <tspan fill="#e2e8f0">db</tspan><tspan x="232" fill="#4ade80">Healthy</tspan></text>
      </g>
      <g class="line l3">
        <path d="M24 111l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="116" fill="#94a3b8">Container <tspan fill="#e2e8f0">api</tspan><tspan x="232" fill="#4ade80">Started</tspan></text>
      </g>
      <g class="line l4">
        <path d="M24 135l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="140" fill="#94a3b8">Container <tspan fill="#e2e8f0">adminer</tspan><tspan x="232" fill="#4ade80">Started</tspan></text>
      </g>

      <text class="line l5" x="22" y="172"><tspan fill="#2dd4bf">$</tspan><tspan fill="#e2e8f0"> curl localhost:8000/health/ready</tspan></text>
      <text class="line l6" x="22" y="196" fill="#fbbf24">{"status":"ready"}</text>
      <g class="line l7">
        <text x="22" y="220" fill="#2dd4bf">$</text>
        <rect class="cursor" x="38" y="207" width="9" height="17" fill="#e2e8f0"/>
      </g>
    </g>
  </g>
</svg>
